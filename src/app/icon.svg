<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Orange background with rounded corners -->
  <rect width="64" height="64" rx="14" fill="#FF7E5F"/>

  <!-- Body -->
  <ellipse cx="32" cy="39" rx="18" ry="17" fill="#D2A070"/>

  <!-- Belly highlight -->
  <ellipse cx="32" cy="43" rx="12" ry="10" fill="#ECC8A0" opacity="0.5"/>

  <!-- Ears -->
  <ellipse cx="20" cy="22" rx="4" ry="4.5" fill="#D2A070"/>
  <ellipse cx="20" cy="22" rx="2.5" ry="3" fill="#E8C4A0"/>
  <ellipse cx="44" cy="22" rx="4" ry="4.5" fill="#D2A070"/>
  <ellipse cx="44" cy="22" rx="2.5" ry="3" fill="#E8C4A0"/>

  <!-- Head -->
  <ellipse cx="32" cy="27" rx="15" ry="13" fill="#D2A070"/>

  <!-- Face lighter area -->
  <ellipse cx="32" cy="30" rx="11" ry="9" fill="#E8C8A8" opacity="0.6"/>

  <!-- Glasses - signature circles -->
  <circle cx="25" cy="26" r="5.5" fill="none" stroke="#4A3728" stroke-width="1.8"/>
  <circle cx="39" cy="26" r="5.5" fill="none" stroke="#4A3728" stroke-width="1.8"/>
  <!-- Bridge -->
  <path d="M 30.5 26 Q 32 24.5 33.5 26" stroke="#4A3728" stroke-width="1.2" fill="none"/>
  <!-- Temple arms -->
  <path d="M 19.5 26 L 16 24" stroke="#4A3728" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 44.5 26 L 48 24" stroke="#4A3728" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Lens tint -->
  <circle cx="25" cy="26" r="4.5" fill="rgba(200,220,255,0.1)"/>
  <circle cx="39" cy="26" r="4.5" fill="rgba(200,220,255,0.1)"/>

  <!-- Eyes -->
  <ellipse cx="25" cy="26" rx="2.2" ry="2.5" fill="#4A3728"/>
  <circle cx="25.8" cy="25.2" r="0.8" fill="white" opacity="0.8"/>
  <ellipse cx="39" cy="26" rx="2.2" ry="2.5" fill="#4A3728"/>
  <circle cx="39.8" cy="25.2" r="0.8" fill="white" opacity="0.8"/>

  <!-- Nose -->
  <ellipse cx="32" cy="31" rx="2" ry="1.3" fill="#8B6F5C"/>

  <!-- Mouth (happy) -->
  <path d="M 28.5 34 Q 32 38 35.5 34" stroke="#4A3728" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Arms -->
  <ellipse cx="16" cy="40" rx="4" ry="2.5" fill="#C4916A" transform="rotate(-15, 16, 40)"/>
  <ellipse cx="48" cy="40" rx="4" ry="2.5" fill="#C4916A" transform="rotate(15, 48, 40)"/>

  <!-- Feet -->
  <ellipse cx="25" cy="54" rx="5" ry="3" fill="#B8845E"/>
  <ellipse cx="39" cy="54" rx="5" ry="3" fill="#B8845E"/>
</svg>
